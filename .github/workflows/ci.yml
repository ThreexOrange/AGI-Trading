name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q agi_trading
      - run: python -m agi_trading providers
      - name: Offline source evidence (not a safety certificate)
        run: |
          python - <<'PY'
          import json
          from agi_trading.verification import audit
          result = audit()
          print(json.dumps(result, indent=2))
          if any(f['severity'] in ('high', 'critical') for f in result['automated_findings']):
              raise SystemExit('Review flagged source patterns before merging')
          PY
